# 通用规则键 -> 改进行动建议（周报展示用）。
# 仓库自定义规则键不在此登记：它们随被检仓库变化，由运行时发现的规则原文提供标题；
# 未登记的键只在展示层翻译规则名，不会派生动作。
# 覆盖规则包 rules/general_rules.md 的全部 R-* 规则 + 两个兜底键。
R-RES: "扫一遍 `open/serial/socket/Popen` 调用, 强制 `with`/`try-finally` + `wait()` 回收"
R-TIME: "所有同步 IO 加 `timeout`, `sleep`/忙等待改为带截止时间的轮询"
R-ASSERT: "断言补 `msg` 并统一 `assertEqual(expected, actual)` / `assert actual == expected` 顺序"
R-ERR: "把裸 `except:` 与静默 `pass` 列为硬错误, 异常统一 `logger.exception` + 标记用例失败"
R-LOG: "业务/测试代码改用分级 `logger`; 用例失败自动采集 dmesg/smartctl/nvme 日志"
R-PERF: "耗时测量固定 `perf_counter()`, 计时区间剔除 setup/打印等无关开销"
R-CONST: "超时/重试/地址等字面量收拢到配置或常量, 读取时校验存在性/类型/值域"
R-SHELL: "`subprocess` 统一 `args` 列表传参, 外部输入走白名单, 加超时与异常类型细化"
R-LOOP: "重试循环加 `max_retry` + 全局 deadline, 遍历修改容器时改用副本"
R-MEM: "大文件/日志改分片流式读写, 缩小大对象生命周期并及时清理缓存"
R-LOCK: "并发操作同一块 SSD/设备必须加进程或文件锁, `finally` 统一解锁与释放"
R-DEP: "三方依赖锁定版本, 系统命令先做可用性检测并配置降级兜底"
R-STATE: "NVMe/磁盘 IO 前置校验设备在位/健康/固件就绪, 异常设备直接终止告警"
R-DATA: "SSD 载荷/LBA/扇区长度下发前校验值域/对齐/长度, 拦截非法参数"
R-CLEAN: "用例后置清理统一收口: 挂载点/裸盘占用/临时镜像无论成败全部回收"
R-NVME: "结构体打包统一字节序常量, 扇区参数取设备实际值, 指令超时执行 abort/复位"
R-REPRO: "测试内禁止写死 `time.time()`/`datetime.now()`, 系统时间用 mock 隔离"
R-FIX: "fixture 前置资源必须配对 teardown, 临时文件/硬件用 `try-finally` 兜底释放"
R-SKIP: "`pytest.skip` 必须带 reason, 平台路径/root 权限加存在性判断与降级"
R-CI: "对并行用例加临时目录 PID 隔离 / 串行锁, 修 flaky"
R-PARAM: "去重参数组合并补 `ids`, 参数化与循环二选一, 可变参数按用例构造"
R-RAISE: "`pytest.raises` 收窄到具体异常并补 `match=`, 块内只保留被测调用"
R-MOCK: "patch 指向使用处并用 `with`/装饰器确保还原, 只 mock 外部依赖"
R-TMP: "临时路径改用 `tmp_path`/`tmp_path_factory`, 共用路径必须 PID/用例 ID 隔离"
R-OTHER-IMPACT: "对跨文件函数签名变化在 MR 描述里点出 caller, 拉对应 owner review"
R-OTHER: "高频『其他』类违规沉淀为规则包中一条显式 R-* 或仓库规则键"
