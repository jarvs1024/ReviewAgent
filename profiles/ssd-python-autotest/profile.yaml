schema_version: 1
name: ssd-python-autotest
description: SSD 自动化测试 Python 代码检视（现网行为）
language: python
# 测试文件判定（PythonPolicy.classify_file / review_mode auto）：命中即按测试代码检视。
# 覆盖 SSD 自动化仓库的用例层、测试库层与共享 fixture。
test_paths: [testcase/, testlib/, test_components/, test_*.py, conftest.py]
prompts:
  improve: prompts/improve.md
  describe: prompts/describe.md
  weekly_inspection_summary: prompts/weekly_inspection_summary.md
  weekly_change_summary: prompts/weekly_change_summary.md
  weekly_quality_scan: prompts/weekly_quality_scan.md
rules: [rules/noise_boundary.md, rules/general_rules.md]
dynamic_rules: rules/dynamic_rules.yaml
