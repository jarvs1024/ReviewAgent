schema_version: 1
rules:
  - key: DYN-CROSS-FILE-REFS
    title: 跨文件引用
    provider: cross_file_refs
    enabled: true
    empty_template: prompts/dynamic/cross_file_refs_empty.md
    items_template: prompts/dynamic/cross_file_refs_refs.md
    params:
      rg_file_type: py
      max_symbols_per_file: 15
      max_refs_per_file: 6
      hits_per_symbol: 2
      timeout_seconds: 35
      excludes:
        - "!reviewagent/**"
        - "!tests/**"
        - "!docs/**"
        - "!tmp_scripts/**"
        - "!settings/**"
        - "!.venv/**"
        - "!**/__pycache__/**"
        - "!.git/**"
    limits: {max_files: 60}
