schema_version: 1
rules:
  - key: DYN-CROSS-FILE-REFS
    title: 跨文件引用
    provider: cross_file_refs
    enabled: true
    template: prompts/dynamic/cross_file_refs.md
    params:
      rg_file_type: py
      max_symbols_per_file: 12
      max_refs_per_file: 5
      hits_per_symbol: 3
      timeout_seconds: 20
    limits: {max_files: 60}
