# 场景调参：ssd-python-autotest（叠加在 profiles/ssd-python-autotest 之上）
#
# 只允许六组：file_filter / scoring / limits / context / repo_context / reporting。
# 只写"与场景包默认不同"的值；不写的键沿用 profile.yaml 默认。
# 本文件会入库，禁止写入 token / webhook 等密钥（密钥只放 config/instance.env）。
#
# 改完执行：.venv/bin/python -m reviewagent config check
#           .venv/bin/python -m reviewagent config show --sources
#           bash scripts/restart_local.sh

schema_version: 1

file_filter:
  # 不进入检视的路径（规则文件/框架自测/临时脚本/文档/工具目录）。
  # conftest.py 不跳过：fixture 是测试业务的真实契约面，需要参与检视。
  skip_paths:
    - tests/
    - tmp_scripts/
    - docs/
    - tools/
  # 关键路径加分：命中任一片段的文件优先进入检视、优先保额。
  # 按真实 SSD 自动化测试仓库分层：用例层 / 库层 / 组件层 / 领域与基础设施。
  priority_paths:
    - /testcase/
    - /testlib/lib_baw/
    - /testlib/lib_bmaw/
    - /testlib/lib_caw/
    - /test_components/
    - /domain/
    - /infrastructure/
    - /framework/
    - /conftest.py

scoring:
  # auto=按测试文件占比自动切换；test=测试代码即业务代码；business=忽略测试特征
  review_mode: test
  # 低于该严重度的建议不发布（low=不过滤；medium=丢掉 low；high=只留 high）
  min_severity: medium
  # 抽样路径与上限：测试资产量大，只抽检一部分；0=不抽样
  test_sample_paths:
    - testcase/
  test_sample_max: 50

limits:
  # 单个 MR 最多发布的建议数（真实 MR 常跨用例/库/组件多层，留足逐条产出空间）
  max_suggestions: 20
  # 最多多少个文件送"完整源码"上下文；其余用 diff ± 上下文
  full_files: 5

reporting:
  # 周报标题与仓库扫描展示类键（原写在 profile.yaml，现统一在本文件）
  weekly_title: "SSD自动化代码检视周报"
  repo_scan_extensions: [.py, .js, .ts, .go, .java, .rs, .rb, .sh]
  repo_scan_entry_files: [__init__.py, main.py, app.py, config.py, settings.py]
