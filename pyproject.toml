[project]
name = "reviewagent"
version = "0.1.0"
description = "GitLab 代码检视平台，基于 opencode + webhook"
requires-python = ">=3.12"
authors = [{ name = "ReviewAgent Team" }]
license = { text = "MIT" }

dependencies = [
    # Web
    "fastapi>=0.118",
    "uvicorn[standard]>=0.32",
    # GitLab
    "python-gitlab>=5.0",
    # opencode HTTP 客户端
    "httpx>=0.27",
    # 任务队列
    "redis>=5.0",
    "rq>=2.0",
    # 日志
    "loguru>=0.7",
    # 提示词 frontmatter
    "python-frontmatter>=1.1",
    # 场景包 profile 清单 (profiles/*/profile.yaml)
    "pyyaml>=6.0",
    # qoder-agent-sdk (LLM Provider 适配层，替代旧 qodercli subprocess)
    # 国际站点（QODER_SDK_EDITION=intl）用这个；国内站点见 extra: qoder-cn
    "qoder-agent-sdk>=1.0.0",
    # 工具
]

[project.optional-dependencies]
# 国内站点（QODER_SDK_EDITION=cn）的 SDK 品牌包；PIP 安装：
#   pip install -e ".[qoder-cn]" -i https://pypi.tuna.tsinghua.edu.cn/simple
qoder-cn = ["qodercn-agent-sdk>=1.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "fakeredis[lua]>=2.20",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reviewagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]